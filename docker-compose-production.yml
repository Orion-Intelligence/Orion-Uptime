services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    command: ["hypercorn", "app.main:app", "--bind", "0.0.0.0:8000", "--workers", "1"]
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      - .env
    environment:
      APP_ENV: production
      MONGO_URI: "mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/?authSource=${DATABASE_NAME}"
      TRUSTED_PROXIES: "10.61.0.0/24"
    expose:
      - "8000"
    depends_on:
      mongodb:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    init: true
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - uptime
    restart: always

  seed:
    build:
      context: backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.seeder.seed"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      MONGO_URI: "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin"
    depends_on:
      mongodb:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - uptime
    restart: "no"

  mongodb:
    image: mongo:7.0.40
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_ROOT_USERNAME}", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - uptime
    restart: always

  nginx:
    image: nginx:1.31-alpine
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_BACKEND: backend:8000
      PRODUCTION_DOMAIN: ${PRODUCTION_DOMAIN:?PRODUCTION_DOMAIN must be set in .env}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      ACME_DIRECTORY_URL: ${ACME_DIRECTORY_URL:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/prod/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/docker-entrypoint.d/18-acme-contact.envsh:/docker-entrypoint.d/18-acme-contact.envsh:ro
      - ./nginx/docker-entrypoint.d/35-acme-state-dir.sh:/docker-entrypoint.d/35-acme-state-dir.sh:ro
      - ./client/build:/client_build:ro
      - nginx_acme:/var/lib/nginx/acme
    read_only: true
    tmpfs:
      - /run:rw,nosuid,nodev,size=16m,mode=755
      - /var/cache/nginx:rw,nosuid,nodev,size=512m,mode=755
      - /etc/nginx/conf.d:rw,nosuid,nodev,size=4m,mode=755
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - uptime
    restart: always

networks:
  uptime:
    name: orion-uptime-production
    ipam:
      config:
        - subnet: 10.61.0.0/24

volumes:
  mongodb_data:
  nginx_acme:
