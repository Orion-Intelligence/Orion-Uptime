[tool.ruff]
line-length = 400
target-version = "py312"
exclude = ["build", ".venv", "__pycache__"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET"]
ignore = ["E501", "B008", "UP042", "UP046", "UP047"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:orion.*", "error::DeprecationWarning:routes.*", "error::DeprecationWarning:configs.*"]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/build/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
