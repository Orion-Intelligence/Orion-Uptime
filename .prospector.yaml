strictness: medium
doc-warnings: false
max-line-length: 400

mccabe:
  options:
    max-complexity: 30

pylint:
  disable:
    - too-many-arguments
    - too-many-positional-arguments
    - too-many-locals
    - too-many-instance-attributes
    - invalid-name
    - unused-argument

pycodestyle:
  options:
    max-line-length: 400
  disable:
    - E301
    - E302
    - E303
    - E305
    - E306
    - E704
    - N815
