name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bash curl git ca-certificates gnupg jq openssl python3
          if ! command -v google-chrome >/dev/null 2>&1; then
            curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google.gpg
            echo "deb [signed-by=/usr/share/keyrings/google.gpg arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends google-chrome-stable
          fi
          google-chrome --version

      - name: Write the CI environment file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 .github/scripts/write-ci-env.py
          test -s .env

      - name: Resolve application ports
        run: |
          set -euo pipefail
          app_port="$(sed -n 's/^APP_PORT=//p' .env | tail -1 | tr -d '\042\047')"
          https_port="$(sed -n 's/^APP_HTTPS_PORT=//p' .env | tail -1 | tr -d '\042\047')"
          echo "APP_PORT=${app_port:-8600}" >> "$GITHUB_ENV"
          echo "APP_HTTPS_PORT=${https_port:-8643}" >> "$GITHUB_ENV"

      - name: Reset Docker state
        run: |
          set -euo pipefail
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true

      - name: Build the client, build the images and start the stack
        run: |
          set -euo pipefail
          chmod +x ./run.sh
          ./run.sh build

      - name: Verify the client build output
        run: |
          set -euo pipefail
          echo "=== checking client build folders ==="
          for dir in client/build backend/build; do
            if [ -f "$dir/index.html" ]; then
              echo "SUCCESS: $dir/index.html exists"
            else
              echo "FAIL: $dir/index.html does not exist"
              ls -la "$dir" || true
              exit 1
            fi
          done
          find client/build -maxdepth 2 -type f -print | head -n 200 || true

      - name: Wait for the application
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            app_code="$(curl -s --connect-timeout 2 --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:${APP_PORT}/" || true)"
            api_code="$(curl -s --connect-timeout 2 --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:${APP_PORT}/api/health" || true)"
            tls_code="$(curl -sk --connect-timeout 2 --max-time 5 -o /dev/null -w '%{http_code}' "https://127.0.0.1:${APP_HTTPS_PORT}/healthz" || true)"
            echo "readiness attempt $i/120: client HTTP ${app_code:-000}, API HTTP ${api_code:-000}, TLS HTTP ${tls_code:-000}"
            if [ "$app_code" = "200" ] && [ "$api_code" = "200" ] && [ "$tls_code" = "200" ]; then
              echo "READY"
              exit 0
            fi
            if [ $((i % 12)) -eq 0 ]; then
              docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
              docker compose -p orion-uptime -f docker-compose.yml logs --since 70s --tail=200 backend nginx || true
            fi
            sleep 5
          done
          echo "FAIL: application not ready"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          docker compose -p orion-uptime -f docker-compose.yml logs --tail=1000 || true
          exit 1

      - name: Install Lighthouse
        run: |
          set -euo pipefail
          npm install -g lighthouse@13.4.1

      - name: Run Lighthouse
        run: |
          set -euo pipefail
          mkdir -p lighthouse-results
          lighthouse "http://127.0.0.1:${APP_PORT}/" \
            --chrome-flags="--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1365,768" \
            --output=json \
            --output=html \
            --output-path=./lighthouse-results/lighthouse-report \
            --only-categories=performance,accessibility,best-practices,seo || true

      - name: Summarize Lighthouse scores
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          report = pathlib.Path("lighthouse-results/lighthouse-report.report.json")
          if not report.is_file():
              print("No Lighthouse report was produced")
              raise SystemExit(0)

          data = json.loads(report.read_text(encoding="utf-8"))
          rows = ["| Category | Score |", "| --- | --- |"]
          for key, category in data.get("categories", {}).items():
              score = category.get("score")
              rows.append(f"| {category.get('title', key)} | {'n/a' if score is None else round(score * 100)} |")
          summary = "\n".join(["## Lighthouse", "", f"URL: {data.get('finalDisplayedUrl') or data.get('requestedUrl')}", "", *rows, ""])
          print(summary)
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as fp:
                  fp.write(summary + "\n")
          PY

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-results
          path: lighthouse-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show service logs on failure
        if: failure()
        run: |
          free -h || true
          df -h || true
          docker stats --no-stream || true
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          docker compose -p orion-uptime -f docker-compose.yml logs --tail=1000 || true

      - if: always()
        run: |
          set -euo pipefail
          ./run.sh stop || true
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true
