name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          set -euo pipefail
          export npm_config_loglevel=error
          (cd client && npm ci)
          python -m pip install --upgrade pip ruff

      - name: Lint the client (eslint + stylelint) and the backend (ruff)
        run: |
          set -euo pipefail
          chmod +x ./run.sh
          ./run.sh lint

  client-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bash curl git ca-certificates gnupg jq openssl python3
          if ! command -v google-chrome >/dev/null 2>&1; then
            curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google.gpg
            echo "deb [signed-by=/usr/share/keyrings/google.gpg arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends google-chrome-stable
          fi
          google-chrome --version

      - name: Write the CI environment file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 .github/scripts/write-ci-env.py
          test -s .env

      - name: Resolve application ports
        run: |
          set -euo pipefail
          app_port="$(sed -n 's/^APP_PORT=//p' .env | tail -1 | tr -d '\042\047')"
          https_port="$(sed -n 's/^APP_HTTPS_PORT=//p' .env | tail -1 | tr -d '\042\047')"
          echo "APP_PORT=${app_port:-8600}" >> "$GITHUB_ENV"
          echo "APP_HTTPS_PORT=${https_port:-8643}" >> "$GITHUB_ENV"

      - name: Reset Docker state
        run: |
          set -euo pipefail
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true

      - name: Build the instrumented client and start the stack
        run: |
          set -euo pipefail
          export npm_config_loglevel=error
          export NODE_OPTIONS=--no-deprecation
          chmod +x ./run.sh
          ./run.sh build -t

      - name: Verify the instrumented client build
        run: |
          set -euo pipefail
          test -f client/build/index.html
          test -f backend/build/index.html
          if ! grep -q '__coverage__' client/build/main.js; then
            echo "FAIL: client/build/main.js is not instrumented"
            exit 1
          fi
          echo "SUCCESS: client build is instrumented"

      - name: Wait for the test service
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            api_code="$(curl -sk --connect-timeout 2 --max-time 5 -o /dev/null -w '%{http_code}' "https://127.0.0.1:${APP_HTTPS_PORT}/api/health" || true)"
            client_code="$(curl -sk --connect-timeout 2 --max-time 5 -o /dev/null -w '%{http_code}' "https://127.0.0.1:${APP_HTTPS_PORT}/" || true)"
            echo "readiness attempt $i/120: API HTTP ${api_code:-000}, client HTTP ${client_code:-000}"
            if [ "$api_code" = "200" ] && [ "$client_code" = "200" ]; then
              exit 0
            fi
            if [ $((i % 12)) -eq 0 ]; then
              docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
              docker compose -p orion-uptime -f docker-compose.yml logs --since 70s --tail=200 backend nginx || true
            fi
            sleep 5
          done
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          docker compose -p orion-uptime -f docker-compose.yml logs --tail=1000 || true
          exit 1

      - name: Run client tests with coverage
        run: |
          set -euo pipefail
          cd client
          export npm_config_loglevel=error
          export NODE_OPTIONS=--no-deprecation
          mkdir -p coverage cypress/downloads cypress/error cypress/screenshots cypress/videos
          rm -rf .nyc_output
          npx cypress verify
          ORION_COVERAGE=true ORION_E2E_BASE_URL="https://127.0.0.1:${APP_HTTPS_PORT}" npx cypress run --e2e --browser chrome
          test -s coverage/lcov.info

      - name: Capture client diagnostics on failure
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p client/cypress/diagnostics
          free -h >client/cypress/diagnostics/memory.txt || true
          df -h >client/cypress/diagnostics/disk.txt || true
          docker stats --no-stream >client/cypress/diagnostics/docker-stats.txt || true
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' >client/cypress/diagnostics/docker-containers.txt || true
          docker compose -p orion-uptime -f docker-compose.yml logs --no-color backend >client/cypress/diagnostics/backend.log 2>&1 || true
          docker compose -p orion-uptime -f docker-compose.yml logs --no-color nginx >client/cypress/diagnostics/nginx.log 2>&1 || true
          docker compose -p orion-uptime -f docker-compose.yml logs --no-color mongodb >client/cypress/diagnostics/mongodb.log 2>&1 || true
          docker compose -p orion-uptime -f docker-compose.yml logs --no-color seed >client/cypress/diagnostics/seed.log 2>&1 || true

      - name: Detect client artifacts
        if: always()
        id: client_artifacts
        run: |
          set -euo pipefail
          has_cypress=false
          has_coverage=false

          if find client/cypress/diagnostics client/cypress/downloads client/cypress/error client/cypress/screenshots client/cypress/videos -type f 2>/dev/null | grep -q .; then
            has_cypress=true
          fi

          if [ -s client/coverage/lcov.info ]; then
            has_coverage=true
          fi

          {
            echo "has_cypress=${has_cypress}"
            echo "has_coverage=${has_coverage}"
          } >> "$GITHUB_OUTPUT"

      - if: always() && steps.client_artifacts.outputs.has_cypress == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cypress-artifacts
          path: |
            client/cypress/diagnostics/
            client/cypress/downloads/
            client/cypress/error/
            client/cypress/screenshots/
            client/cypress/videos/
          if-no-files-found: ignore
          retention-days: 7

      - if: always() && steps.client_artifacts.outputs.has_coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-coverage
          path: client/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Show client service logs on failure
        if: failure()
        run: |
          free -h || true
          df -h || true
          docker stats --no-stream || true
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          docker compose -p orion-uptime -f docker-compose.yml logs --tail=1000 || true

      - if: always()
        run: |
          set -euo pipefail
          ./run.sh stop || true
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true

  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run backend tests with coverage
        run: |
          set -euo pipefail
          chmod +x ./run.sh
          ./run.sh test -c

      - name: Verify the backend coverage report
        run: |
          set -euo pipefail
          test -s backend/coverage.xml

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  coverage-report:
    runs-on: ubuntu-latest
    needs: [client-tests, backend-tests]
    if: needs.client-tests.result == 'success' && needs.backend-tests.result == 'success'
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download client coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: client-coverage
          path: client/coverage

      - name: Download backend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-coverage
          path: backend

      - name: Normalize coverage paths to the repository root
        run: |
          set -euo pipefail
          test -s client/coverage/lcov.info
          test -s backend/coverage.xml
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path(".").resolve()

          def root_relative(raw, base):
              candidate = pathlib.Path(raw)
              if not candidate.is_absolute():
                  candidate = base / candidate
              candidate = candidate.resolve()
              try:
                  return candidate.relative_to(root).as_posix()
              except ValueError:
                  return raw

          # Cypress/nyc writes paths relative to the client workspace.
          lcov_path = root / "client" / "coverage" / "lcov.info"
          lcov_lines = []
          client_files = 0
          for line in lcov_path.read_text(encoding="utf-8", errors="ignore").splitlines():
              if line.startswith("SF:"):
                  line = "SF:" + root_relative(line[3:], root / "client")
                  client_files += 1
              lcov_lines.append(line)
          lcov_path.write_text("\n".join(lcov_lines) + "\n", encoding="utf-8")

          # pytest-cov writes filenames relative to the --cov source (backend/app).
          xml_path = root / "backend" / "coverage.xml"
          tree = ET.parse(xml_path)
          coverage = tree.getroot()
          base = root / "backend" / "app"
          for source in coverage.iter("source"):
              text = (source.text or "").strip()
              if text and pathlib.Path(text).is_absolute():
                  try:
                      pathlib.Path(text).resolve().relative_to(root)
                      base = pathlib.Path(text).resolve()
                      break
                  except ValueError:
                      continue
          backend_files = 0
          for cls in coverage.iter("class"):
              cls.set("filename", root_relative(cls.get("filename", ""), base))
              backend_files += 1
          sources = coverage.find("sources")
          if sources is not None:
              for child in list(sources):
                  sources.remove(child)
              ET.SubElement(sources, "source").text = str(root)
          tree.write(xml_path, encoding="utf-8", xml_declaration=True)

          print(f"Normalized {client_files} client file(s) and {backend_files} backend file(s)")
          print(lcov_path.read_text(encoding="utf-8").splitlines()[1] if client_files else "no client files")
          PY
          grep -m1 '^SF:' client/coverage/lcov.info
          grep -m1 -o 'filename="[^"]*"' backend/coverage.xml

      - name: Detect coverage reports
        id: codacy_reports
        run: |
          set -euo pipefail
          test -s client/coverage/lcov.info
          test -s backend/coverage.xml
          echo "reports=client/coverage/lcov.info,backend/coverage.xml" >> "$GITHUB_OUTPUT"

      - name: Upload combined coverage to Codacy
        if: env.CODACY_PROJECT_TOKEN != '' && steps.codacy_reports.outputs.reports != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ steps.codacy_reports.outputs.reports }}

      - name: Skip the Codacy upload
        if: env.CODACY_PROJECT_TOKEN == ''
        run: echo "CODACY_PROJECT_TOKEN is not available for this run; skipping the Codacy coverage upload."

      - name: Build merged coverage summary (client + backend)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path(".")
          lcov_path = root / "client" / "coverage" / "lcov.info"
          backend_xml = root / "backend" / "coverage.xml"
          out_dir = root / "coverage-merged"
          out_dir.mkdir(parents=True, exist_ok=True)

          client_total = 0
          client_covered = 0
          if lcov_path.exists() and lcov_path.stat().st_size > 0:
            for raw in lcov_path.read_text(encoding="utf-8", errors="ignore").splitlines():
              if raw.startswith("DA:"):
                _, pair = raw.split("DA:", 1)
                parts = pair.split(",")
                if len(parts) != 2:
                  continue
                hits = int(parts[1])
                client_total += 1
                if hits > 0:
                  client_covered += 1

          backend_total = 0
          backend_covered = 0
          if backend_xml.exists() and backend_xml.stat().st_size > 0:
            cov = ET.parse(backend_xml).getroot()
            backend_total = int(cov.attrib.get("lines-valid", "0"))
            backend_covered = int(cov.attrib.get("lines-covered", "0"))

          if (client_total + backend_total) == 0:
            raise SystemExit("No client or backend coverage files were produced")

          total_lines = client_total + backend_total
          covered_lines = client_covered + backend_covered
          pct = (covered_lines / total_lines * 100.0) if total_lines else 0.0

          summary = {
            "client": {
              "covered_lines": client_covered,
              "total_lines": client_total,
              "line_coverage_percent": round((client_covered / client_total * 100.0) if client_total else 0.0, 2),
            },
            "backend": {
              "covered_lines": backend_covered,
              "total_lines": backend_total,
              "line_coverage_percent": round((backend_covered / backend_total * 100.0) if backend_total else 0.0, 2),
            },
            "combined": {
              "covered_lines": covered_lines,
              "total_lines": total_lines,
              "line_coverage_percent": round(pct, 2),
            },
          }

          markdown = "\n".join(
            [
              "# Combined Coverage Summary",
              "",
              f"- Client (LCOV): {summary['client']['covered_lines']}/{summary['client']['total_lines']} ({summary['client']['line_coverage_percent']}%)",
              f"- Backend (Cobertura XML): {summary['backend']['covered_lines']}/{summary['backend']['total_lines']} ({summary['backend']['line_coverage_percent']}%)",
              f"- Combined: {summary['combined']['covered_lines']}/{summary['combined']['total_lines']} ({summary['combined']['line_coverage_percent']}%)",
              "",
            ]
          )
          (out_dir / "coverage-summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          (out_dir / "coverage-summary.md").write_text(markdown, encoding="utf-8")
          print(markdown)

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
            with open(step_summary, "a", encoding="utf-8") as fp:
              fp.write(markdown + "\n")
          PY

      - name: Detect merged coverage artifacts
        id: coverage_artifacts
        run: |
          set -euo pipefail
          has_coverage=false
          if [ -s coverage-merged/coverage-summary.json ] || [ -s coverage-merged/coverage-summary.md ]; then
            has_coverage=true
          fi
          echo "has_coverage=${has_coverage}" >> "$GITHUB_OUTPUT"

      - if: steps.coverage_artifacts.outputs.has_coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-artifacts
          path: |
            backend/coverage.xml
            client/coverage/lcov.info
            coverage-merged/coverage-summary.json
            coverage-merged/coverage-summary.md
          if-no-files-found: ignore
          retention-days: 7
