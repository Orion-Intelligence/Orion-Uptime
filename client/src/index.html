<!doctype html>
<html lang="en" class="light-theme tw:m-0 tw:min-h-full tw:min-w-80 tw:overflow-x-hidden tw:bg-[#edf4fb] tw:dark:bg-[#0e1626] tw:scheme-light tw:dark:scheme-dark">
  <head>
    <meta charset="utf-8" />
    <title>Orion Uptime · Orion Intelligence</title>
    <base href="/" />
    <script>
      (function () {
        var path = window.location.pathname;
        var isPublicStatus = path.indexOf('/status/') === 0;
        var theme = 'light';
        var signedIn = false;
        try {
          var stored = window.localStorage.getItem('orion-uptime-theme');
          if (!isPublicStatus && (stored === 'dark' || stored === 'light')) {
            theme = stored;
          }
          signedIn = window.localStorage.getItem('orion-uptime-signed-in') === '1';
        } catch (error) {
        }
        var root = document.documentElement;
        root.classList.remove('dark-theme', 'light-theme');
        root.classList.add(theme + '-theme');
        if (!isPublicStatus && !signedIn) {
          root.classList.add('login-boot');
        }
        window.setTimeout(function () { root.classList.add('orion-ready'); }, 3000);
      })();
    </script>
    <style>
      html, body { margin: 0; min-height: 100%; background-color: #edf4fb; }
      html.dark-theme, html.dark-theme body { background-color: #0e1626; }
      html.login-boot, html.login-boot body { background-color: #0e1626; }
      @media (max-width: 943px) {
        html.login-boot, html.login-boot body { background-color: #fff; }
      }
      app-root { display: block; opacity: 0; }
      html.orion-ready app-root { opacity: 1; transition: opacity 260ms ease-out; }
      @media (prefers-reduced-motion: reduce) {
        app-root { opacity: 1; }
        html.orion-ready app-root { transition: none; }
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Orion Uptime monitors HTTP, API, ping and heartbeat targets, tracks incidents, and publishes public status pages." />
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body class="tw:m-0 tw:min-h-full tw:min-w-80 tw:overflow-x-hidden tw:bg-[#edf4fb] tw:dark:bg-[#0e1626] tw:text-[#142033] tw:dark:text-[#fff] tw:font-[Inter,Roboto,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe_UI',sans-serif] tw:text-[14px] tw:antialiased tw:[font-synthesis:none] tw:[text-rendering:optimizeLegibility] tw:[&_app-shell]:block tw:[&_app-shell]:min-h-dvh tw:[&_button:focus-visible]:outline-2 tw:[&_button:focus-visible]:outline-[#57a5eb] tw:[&_button:focus-visible]:outline-offset-2 tw:[&_a:focus-visible]:outline-2 tw:[&_a:focus-visible]:outline-[#57a5eb] tw:[&_a:focus-visible]:outline-offset-2 tw:[&_input:focus-visible]:outline-2 tw:[&_input:focus-visible]:outline-[#57a5eb] tw:[&_input:focus-visible]:outline-offset-2 tw:[&_select:focus-visible]:outline-2 tw:[&_select:focus-visible]:outline-[#57a5eb] tw:[&_select:focus-visible]:outline-offset-2 tw:[&_textarea:focus-visible]:outline-2 tw:[&_textarea:focus-visible]:outline-[#57a5eb] tw:[&_textarea:focus-visible]:outline-offset-2 tw:motion-reduce:[&_*]:scroll-auto! tw:motion-reduce:[&_*]:animate-none! tw:motion-reduce:[&_*]:transition-none!">
    <app-root></app-root>
  </body>
</html>
