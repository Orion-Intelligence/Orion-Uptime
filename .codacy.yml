---
exclude_paths:
  - "client/build/**"
  - "client/coverage/**"
  - "client/.nyc_output/**"
  - "coverage-merged/**"
  - "lighthouse-results/**"
  - "client/.angular/**"
  - "client/node_modules/**"
  - "client/public/**"
  - "client/src/assets/**"
  - "client/*.config.*"
  - "backend/build/**"
  - "backend/tests/**"
  - "client/cypress/**"
  - "client/cypress.config.ts"
  - "client/scripts/**"
  - "**/*.cy.ts"
  - "**/*.spec.ts"
  - "**/*.d.ts"
  - ".github/**"
  - "run.sh"
  - "**/*.md"
  - "**/*.sh"
  - "**/*.yml"
  - "**/*.yaml"
  - "**/*.json"
  - "**/*.map"
  - "**/eslint.config.js"

engines:
  metric:
    config:
      languages:
        - "python"
        - "typescript"
        - "javascript"
  duplication:
    exclude_paths:
      - "client/build/**"
      - "client/coverage/**"
      - "client/.nyc_output/**"
      - "coverage-merged/**"
      - "lighthouse-results/**"
      - "client/.angular/**"
      - "client/node_modules/**"
      - "client/public/**"
      - "client/src/assets/**"
      - "client/*.config.*"
      - "backend/build/**"
      - "backend/tests/**"
      - "client/cypress/**"
      - "client/cypress.config.ts"
      - "client/scripts/**"
      - "**/*.cy.ts"
      - "**/*.spec.ts"
      - "**/*.d.ts"
      - ".github/**"
      - "run.sh"
      - "**/eslint.config.js"
